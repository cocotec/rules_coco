name: Release tools
description: >-
  Installs the tools that tools/release_policy.py needs (commitizen), with everything they depend on pinned by hash in
  tools/requirements-release.txt. They come from PyPI, so use this only in jobs that hold no credentials.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        cache: pip
        cache-dependency-path: tools/requirements-release.txt
    - shell: bash
      run: pip install --require-hashes -r tools/requirements-release.txt
