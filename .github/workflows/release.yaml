name: Release
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release: main, or release/X.Y"
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - "version.bzl"
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release
        id: check
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run the Release workflow from main; choose the branch to release with its input." >&2
            exit 1
          fi
          args=(release --branch "$BRANCH")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--commit "$GITHUB_SHA")
          fi
          python3 tools/check_release.py "${args[@]}" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
      - name: Summarize the release
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo "- Branch: \`$BRANCH\`"
            echo "- Commit: [\`$COMMIT\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT)"
            if [[ -n "$PREVIOUS" ]]; then
              echo "- Changes since $PREVIOUS: [$PREVIOUS...$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS...$COMMIT)"
            fi
            if [[ "$BRANCH" == main ]]; then
              echo
              echo "Once released, an admin creates \`release/${VERSION%.*}\` for its patch releases:"
              echo
              echo "    python tools/release.py --create-release-branch"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
          COMMIT: ${{ steps.check.outputs.commit }}
          VERSION: ${{ steps.check.outputs.version }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
  release:
    needs: validation
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validation.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validation.outputs.commit }}
      ARCHIVE: ${{ github.workspace }}/.github/rules_coco_${{ needs.validation.outputs.version }}.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validation.outputs.commit }}
          path: target
          persist-credentials: false
      - name: Create the rules archive
        run: |
          tar -czf "$ARCHIVE" -C "$GITHUB_WORKSPACE/target" --exclude=".git" --exclude=".github" .
          sha256_base64="$(shasum --algorithm 256 "$ARCHIVE" | awk '{ print $1 }' | xxd -r -p | base64)"
          echo "ARCHIVE_SHA256_BASE64=${sha256_base64}" >> "$GITHUB_ENV"
      # Upload the artifact in case creating a release fails so all artifacts can then be manually recovered.
      - uses: actions/upload-artifact@v7
        with:
          name: "rules_coco_${{ env.RELEASE_VERSION }}.tar.gz"
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
      - name: Generate release notes
        run: |
          sed "s#{version}#${RELEASE_VERSION}#g" .github/release_notes.template \
          | sed "s#{sha256_base64}#${ARCHIVE_SHA256_BASE64}#g" \
          > .github/release_notes.txt
      - name: Create release and upload archive
        run: |
          args=()
          if [[ -n "$PREVIOUS" ]]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$RELEASE_VERSION" "$ARCHIVE" \
            --title "$RELEASE_VERSION" \
            --notes-file .github/release_notes.txt \
            --generate-notes \
            --latest="$LATEST" \
            --target "$RELEASE_COMMIT" \
            "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ needs.validation.outputs.previous }}
          LATEST: ${{ needs.validation.outputs.latest }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: "Upload to dl.cocotec.io"
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: ${{ env.ARCHIVE }}
          destination: "cocotec-downloads/rules_coco"
          process_gcloudignore: false
      - name: Generate renovate_versions.json
        run: |
          python3 tools/generate_renovate_versions.py \
            --bucket cocotec-downloads \
            --prefix rules_coco \
            --out .github/renovate_versions.json \
            --pretty
      - name: "Upload renovate_versions.json to dl.cocotec.io"
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: "${{ github.workspace }}/.github/renovate_versions.json"
          destination: "cocotec-downloads/rules_coco"
          process_gcloudignore: false
