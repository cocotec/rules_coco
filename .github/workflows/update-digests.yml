name: Update Digests
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write

concurrency:
  group: update-digests
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the release branch
        id: branch
        shell: bash
        run: |
          release=$(python3 tools/check_release.py digests-branch)
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Generate GitHub App Token
        id: generate_token
        shell: bash
        run: |
          TOKEN=$(python3 .github/scripts/github_app_token.py)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
        env:
          COCOTEC_BOT_APP_ID: ${{ secrets.COCOTEC_BOT_APP_ID }}
          COCOTEC_BOT_INSTALLATION_ID: ${{ secrets.COCOTEC_BOT_INSTALLATION_ID }}
          GCP_KMS_PROJECT: ${{ secrets.GCP_KMS_PROJECT }}
          GCP_KMS_LOCATION: ${{ secrets.GCP_KMS_LOCATION }}
          GCP_KMS_KEYRING: ${{ secrets.GCP_KMS_KEYRING }}
          GCP_KMS_KEY: ${{ secrets.GCP_KMS_KEY }}
          GCP_KMS_KEY_VERSION: ${{ secrets.GCP_KMS_KEY_VERSION }}

      - name: Create Pull Requests
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "cocotec-automation[bot]"
          git config --global user.email "244153713+cocotec-automation[bot]@users.noreply.github.com"

          open_pr() {
            local base=$1 bump=$2
            local open
            open=$(gh pr list --base "$base" --state open --json headRefName \
              --jq 'map(select(.headRefName | startswith("chore/update-digests-"))) | length')
            if [[ "$open" != 0 ]]; then
              echo "::notice::$base already has an open pull request updating the digests."
              return
            fi

            git checkout --quiet --detach "origin/$base"
            python3 tools/update_digests.py
            if git diff --quiet; then
              echo "::notice::$base already has the newest digests."
              return
            fi

            local title body
            if [[ "$bump" == bump ]]; then
              python3 tools/release.py --bump patch
              local version
              version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' version.bzl)
              title="chore(deps): update popili digests and release ${version}"
              # printf, not a block scalar or heredoc: those leak YAML indentation and eat the backticks.
              body=$(printf '%s\n' \
                "Updates Popili digests and bumps the version to ${version}." \
                '' \
                "Approving is enough: it merges once \`build\` is green, and merging releases ${version}.")
            else
              title="chore(deps): update popili digests"
              body=$(printf '%s\n' \
                "Updates Popili digests. They are released from \`${RELEASE_BRANCH}\`." \
                '' \
                'Approving is enough: it joins the merge queue once `build` is green.')
            fi

            local branch="chore/update-digests-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${base//\//-}"
            git add coco/private/known_shas.bzl coco/private/version_aliases.bzl version.bzl MODULE.bazel CHANGELOG.md
            git commit --quiet --message "$title"
            git push origin "HEAD:refs/heads/$branch"

            local url
            url=$(gh pr create --base "$base" --head "$branch" --title "$title" --body "$body")

            # Non-fatal: the pull request exists either way and can be merged by hand.
            if MERGE_ERROR=$(gh pr merge "$url" --auto --squash 2>&1); then
              echo "::notice::Auto-merge enabled on ${url}; merges once approved and build passes."
            else
              echo "::warning::Could not enable auto-merge on ${url}: ${MERGE_ERROR}"
            fi

            echo "Opened ${url}" >> "$GITHUB_STEP_SUMMARY"
          }

          version=$(git show "origin/$RELEASE_BRANCH:version.bzl" | sed -n 's/^VERSION = "\(.*\)"$/\1/p')
          if [[ -z "$(git tag --list "$version")" ]]; then
            echo "::warning::$RELEASE_BRANCH holds $version, which is not released yet, so its digests are not updated."
          else
            open_pr "$RELEASE_BRANCH" bump
          fi
          open_pr main no-bump
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.release }}
